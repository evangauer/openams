name: CodeQL

on:
  push:
    branches: [main, "security/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: ${{ github.event_name == 'pull_request' && 'Analyze changed code' || 'Analyze full source' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:javascript-typescript
          output: ${{ runner.temp }}/codeql-results
          # Private repositories without code scanning can still run the analysis.
          # Keep the same findings gate and retain its report in either mode.
          upload: ${{ github.event.repository.private && 'never' || 'always' }}
          upload-database: false
      - name: Check the findings gate
        run: node --test scripts/check-codeql-results.test.mjs
      - name: Require a completed scan with no findings
        run: node scripts/check-codeql-results.mjs "$RUNNER_TEMP/codeql-results/javascript.sarif"
      - name: Retain analysis results
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: codeql-results
          path: ${{ runner.temp }}/codeql-results/*.sarif
          if-no-files-found: error
          retention-days: 14
